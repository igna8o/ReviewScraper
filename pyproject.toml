[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewscraper"
version = "0.1.0"
description = "Self-hosted Google Maps review scraping API with an Outscraper-compatible interface"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
reviewscraper = "reviewscraper.cli:main"

[tool.setuptools.packages.find]
include = ["reviewscraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits Google for real (run with -m live)"]
addopts = "-m 'not live'"
